<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wizarding Game</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070b1a;
        color: #e8e6f0;
        overflow: hidden;
      }
      #stage,
      #hud {
        position: fixed;
        inset: 0;
      }
      .stage-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* The glowing wand dot is the cursor over the stage. */
      #stage {
        cursor: none;
        touch-action: none;
      }
      /* No text selection while a stroke is being drawn. */
      body.drawing {
        user-select: none;
        -webkit-user-select: none;
      }
      /* HTML overlays sit above the canvas (D-023); only their own panels take clicks. */
      #hud {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
